<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Language Launch · Practice · Galileo ELD</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f4fa;
  --card: #ffffff;
  --ink: #1a2332;
  --muted: #6b7a90;
  --border: #dde5f0;
  --blue: #2563eb;
  --blue-dk: #1d4ed8;
  --blue-lt: #dbeafe;
  --green: #16a34a;
  --green-lt: #dcfce7;
  --red: #dc2626;
  --red-lt: #fee2e2;
  --amber: #d97706;
  --amber-lt: #fef3c7;
  --purple: #7c3aed;
  --purple-lt: #ede9fe;
  --r: 16px;
  --r-sm: 10px;
  --sh: 0 2px 16px rgba(37,99,235,.09);
  --sh-lg: 0 6px 32px rgba(37,99,235,.14);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}

/* ── SCREENS ── */
.screen{display:none;}
.screen.active{display:block;animation:screenIn .35s ease;}
#screen-login.active{display:flex;}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── LOGIN ── */
#screen-login{
  align-items:center;justify-content:center;
  min-height:100vh;
  background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 50%,#7c3aed 100%);
  padding:20px;
}
.login-card{
  background:var(--card);border-radius:24px;padding:36px 32px;
  width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.login-logo{font-family:'Fraunces',serif;font-size:1.8rem;font-weight:900;color:var(--blue);text-align:center;margin-bottom:4px;}
.login-logo em{color:var(--purple);font-style:normal;}
.login-sub{text-align:center;font-size:.82rem;color:var(--muted);margin-bottom:28px;font-weight:600;text-transform:uppercase;letter-spacing:1px;}
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px;}
.form-input,.form-select{
  width:100%;padding:11px 14px;border:2px solid var(--border);border-radius:var(--r-sm);
  font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;color:var(--ink);
  background:var(--bg);outline:none;transition:border-color .15s;
}
.form-input:focus,.form-select:focus{border-color:var(--blue);}
.form-select option{background:#fff;}
.btn-login{
  width:100%;padding:13px;border-radius:var(--r-sm);border:none;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  color:#fff;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:900;
  cursor:pointer;transition:all .18s;margin-top:8px;
  box-shadow:0 4px 16px rgba(37,99,235,.35);
}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(37,99,235,.45);}
.login-err{color:var(--red);font-size:.82rem;font-weight:700;text-align:center;margin-top:8px;min-height:18px;}
.login-hint{text-align:center;font-size:.75rem;color:var(--muted);margin-top:16px;}

/* ── HEADER (student) ── */
.student-header{
  background:linear-gradient(135deg,#1e3a8a,#2563eb);
  padding:12px 18px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2);
  flex-wrap:wrap;gap:8px;
}
.hdr-left{display:flex;align-items:center;gap:10px;}
.hdr-logo{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:900;color:#fff;}
.hdr-logo em{color:#fbbf24;font-style:normal;}
.hdr-user{font-size:.75rem;font-weight:700;color:#bfdbfe;text-transform:uppercase;letter-spacing:.5px;}
.score-badge{
  background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.25);
  border-radius:20px;padding:4px 14px;
  font-size:.85rem;font-weight:900;color:#fff;
  display:flex;align-items:center;gap:6px;
}
.score-badge .score-num{font-size:1.1rem;color:#fbbf24;}

/* ── MAIN CONTENT ── */
.content-wrap{max-width:660px;margin:0 auto;padding:20px 16px 60px;}

/* ── ASSIGNMENT LIST ── */
.section-title{
  font-family:'Fraunces',serif;font-size:1.3rem;font-weight:900;color:var(--ink);
  margin-bottom:4px;
}
.section-sub{font-size:.82rem;color:var(--muted);font-weight:600;margin-bottom:18px;}

.assignment-card{
  background:var(--card);border:2px solid var(--border);border-radius:var(--r);
  padding:18px;margin-bottom:12px;cursor:pointer;
  box-shadow:var(--sh);transition:all .18s;
  display:flex;align-items:center;gap:14px;
}
.assignment-card:hover{transform:translateY(-2px);box-shadow:var(--sh-lg);border-color:var(--blue);}
.assignment-card.completed{border-color:var(--green);background:linear-gradient(135deg,#f0fdf4,#fff);}
.assignment-card.locked{opacity:.5;cursor:default;pointer-events:none;}
.asgn-icon{
  width:48px;height:48px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;
}
.asgn-icon.blue{background:var(--blue-lt);}
.asgn-icon.green{background:var(--green-lt);}
.asgn-icon.amber{background:var(--amber-lt);}
.asgn-icon.purple{background:var(--purple-lt);}
.asgn-body{flex:1;min-width:0;}
.asgn-title{font-weight:800;font-size:1rem;color:var(--ink);margin-bottom:2px;}
.asgn-meta{font-size:.75rem;color:var(--muted);font-weight:600;}
.asgn-right{text-align:right;flex-shrink:0;}
.asgn-pct{
  font-size:1.3rem;font-weight:900;
  color:var(--green);
}
.asgn-pct.zero{color:var(--muted);}
.asgn-status{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}
.asgn-status.done{color:var(--green);}

/* progress mini bar */
.mini-bar{height:4px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden;}
.mini-fill{height:100%;background:var(--green);border-radius:2px;transition:width .4s;}

/* ── QUESTION SCREEN ── */
.q-header{
  background:var(--card);border-bottom:2px solid var(--border);
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
}
.q-assignment-name{font-weight:800;font-size:.9rem;color:var(--ink);}
.q-progress-text{font-size:.78rem;font-weight:700;color:var(--muted);}
.q-progress-bar{height:4px;background:var(--border);margin:0 18px;}
.q-progress-fill{height:100%;background:var(--blue);transition:width .3s;}

.question-wrap{max-width:600px;margin:0 auto;padding:20px 16px 60px;}

.q-card{
  background:var(--card);border:2px solid var(--border);border-radius:var(--r);
  padding:22px;margin-bottom:16px;box-shadow:var(--sh);
}
.q-type-label{
  font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:2px;
  color:var(--blue);margin-bottom:10px;display:flex;align-items:center;gap:5px;
}
.q-prompt{font-size:1.05rem;font-weight:700;color:var(--ink);line-height:1.5;margin-bottom:16px;}
.q-prompt strong{color:var(--blue);font-family:'Fraunces',serif;font-size:1.2rem;}

/* MC options */
.mc-opts{display:flex;flex-direction:column;gap:8px;}
.mc-opt{
  padding:11px 14px;border-radius:var(--r-sm);border:2px solid var(--border);
  background:var(--card);font-family:'Nunito',sans-serif;font-size:.92rem;
  font-weight:700;color:var(--ink);cursor:pointer;text-align:left;
  transition:all .15s;
}
.mc-opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-lt);}
.mc-opt.correct{border-color:var(--green);background:var(--green-lt);color:#166534;}
.mc-opt.wrong{border-color:var(--red);background:var(--red-lt);color:#991b1b;}
.mc-opt.reveal{border-color:var(--green);background:var(--green-lt);color:#166534;}
.mc-opt:disabled{cursor:default;}

/* TF */
.tf-opts{display:flex;gap:10px;}
.tf-opt{
  flex:1;padding:13px;border-radius:var(--r-sm);border:2px solid var(--border);
  background:var(--card);font-family:'Nunito',sans-serif;font-size:1rem;
  font-weight:800;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.tf-opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-lt);}
.tf-opt.correct{border-color:var(--green);background:var(--green-lt);color:#166534;}
.tf-opt.wrong{border-color:var(--red);background:var(--red-lt);color:#991b1b;}
.tf-opt:disabled{cursor:default;}

/* FIB */
.fib-sentence{font-size:1.05rem;font-weight:700;line-height:2.2;color:var(--ink);margin-bottom:6px;}
.fib-blank{
  display:inline-block;border:none;border-bottom:3px solid var(--blue);
  width:120px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;
  color:var(--blue);background:transparent;text-align:center;outline:none;
  transition:border-color .15s;padding:0 4px;
}
.fib-blank:focus{border-bottom-color:var(--purple);}
.fib-blank.correct{border-bottom-color:var(--green);color:var(--green);}
.fib-blank.wrong{border-bottom-color:var(--red);color:var(--red);}
.word-bank-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;
  padding:10px;background:var(--blue-lt);border-radius:var(--r-sm);}
.wb-chip{
  padding:5px 12px;border-radius:20px;background:var(--card);
  border:1.5px solid var(--blue);color:var(--blue);
  font-size:.82rem;font-weight:800;cursor:pointer;
  font-family:'Nunito',sans-serif;transition:all .15s;
}
.wb-chip:hover{background:var(--blue);color:#fff;}
.wb-chip.used{opacity:.3;pointer-events:none;}

/* feedback row */
.q-feedback{
  margin-top:12px;font-size:.88rem;font-weight:700;min-height:22px;
  display:flex;align-items:flex-start;gap:7px;flex-wrap:wrap;
}
.q-feedback.ok{color:var(--green);}
.q-feedback.err{color:var(--red);}

/* AI feedback panel */
.ai-panel{
  margin-top:12px;background:linear-gradient(135deg,#f5f3ff,#ede9fe);
  border:2px solid #c4b5fd;border-radius:var(--r-sm);padding:14px;
  display:none;animation:fadeIn .3s ease;
}
.ai-panel.show{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.ai-label{font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;color:var(--purple);margin-bottom:6px;}
.ai-text{font-size:.88rem;color:var(--ink);line-height:1.6;font-weight:600;}
.ai-text-native{font-size:.88rem;color:var(--purple);line-height:1.6;font-weight:700;margin-top:6px;}
.ai-loading{color:var(--purple);font-style:italic;font-size:.85rem;}

/* teacher feedback row (read-only for student) */
.teacher-fb-row{
  margin-top:12px;padding:10px 12px;background:#fffbeb;
  border:1.5px solid #fde68a;border-radius:var(--r-sm);
  display:none;
}
.teacher-fb-row.show{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;}
.t-score-pill{
  background:#fef3c7;border:1.5px solid #fbbf24;border-radius:20px;
  padding:3px 11px;font-size:.8rem;font-weight:900;color:#92400e;white-space:nowrap;
}
.t-comment{font-size:.82rem;font-weight:600;color:var(--ink);line-height:1.5;}

/* next button */
.btn-next{
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 28px;border-radius:var(--r-sm);border:none;
  background:var(--blue);color:#fff;font-family:'Nunito',sans-serif;
  font-size:.95rem;font-weight:900;cursor:pointer;
  transition:all .18s;margin-top:16px;
  box-shadow:0 4px 14px rgba(37,99,235,.3);
}
.btn-next:hover{background:var(--blue-dk);transform:translateY(-1px);}
.btn-next:disabled{opacity:.4;pointer-events:none;}

/* ── SCORE SCREEN ── */
#screen-score{background:var(--bg);}
.score-screen-wrap{max-width:560px;margin:0 auto;padding:30px 16px 60px;}
.score-hero{
  background:linear-gradient(135deg,#16a34a,#0d9488);
  border-radius:var(--r);padding:32px 28px;text-align:center;
  box-shadow:var(--sh-lg);margin-bottom:20px;color:#fff;
}
.score-hero.partial{background:linear-gradient(135deg,var(--amber),#f59e0b);}
.score-hero.low{background:linear-gradient(135deg,var(--blue),var(--purple));}
.score-emoji{font-size:3rem;margin-bottom:8px;}
.score-main{font-family:'Fraunces',serif;font-size:3.5rem;font-weight:900;line-height:1;}
.score-label{font-size:.85rem;opacity:.85;margin-top:4px;}
.score-assignment{font-size:1rem;font-weight:700;opacity:.9;margin-bottom:16px;}

.score-breakdown{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:16px;}
.breakdown-title{font-weight:800;font-size:.88rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:12px;}
.breakdown-item{
  display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--border);font-size:.88rem;
}
.breakdown-item:last-child{border-bottom:none;}
.bi-icon{width:22px;text-align:center;flex-shrink:0;}
.bi-text{flex:1;font-weight:600;color:var(--ink);}
.bi-result{font-weight:800;font-size:.82rem;}
.bi-result.ok{color:var(--green);}
.bi-result.err{color:var(--red);}

.btn-retry,.btn-home{
  width:100%;padding:13px;border-radius:var(--r-sm);border:none;
  font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:900;
  cursor:pointer;transition:all .18s;margin-bottom:10px;
}
.btn-retry{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.3);}
.btn-retry:hover{background:var(--blue-dk);}
.btn-home{background:var(--card);color:var(--ink);border:2px solid var(--border);}
.btn-home:hover{border-color:var(--blue);color:var(--blue);}

/* ── RESPONSIVE ── */
@media(max-width:420px){
  .login-card{padding:28px 20px;}
  .login-logo{font-size:1.5rem;}
  .tf-opt{padding:10px 8px;font-size:.9rem;}
}
</style>
</head>

/* ════════════════════════════════════════════
   SUPABASE HELPERS
════════════════════════════════════════════ */
async function supaGet(table, query) {
  try {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${query}`, {
      headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` }
    });
    return await r.json();
  } catch(e) { return []; }
}
async function supaUpsert(table, data) {
  try {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}`, {
      method: 'POST',
      headers: {
        apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=representation'
      },
      body: JSON.stringify(data)
    });
    return await r.json();
  } catch(e) { return null; }
}

/* ════════════════════════════════════════════
   LOGIN
════════════════════════════════════════════ */
function attemptLogin() {
  const loginBtn = document.getElementById('btn-login');
  if (loginBtn) { loginBtn.textContent = 'Loading…'; loginBtn.style.opacity = '0.7'; }
  const period = document.getElementById('inp-period').value;
  const name   = document.getElementById('inp-name').value.trim();
  const user   = document.getElementById('inp-username').value.trim().toLowerCase();
  const lang   = document.getElementById('inp-lang').value;
  const err    = document.getElementById('login-err');

  if (user === 'teacher') {
    window.location.href = DASHBOARD_URL;
    return;
  }

  if (!period) { if(loginBtn){loginBtn.textContent='Enter →';loginBtn.style.opacity='1';} err.textContent = 'Please select your period.'; return; }
  if (!name)   { if(loginBtn){loginBtn.textContent='Enter →';loginBtn.style.opacity='1';} err.textContent = 'Please enter your first name.'; return; }
  if (!user)   { if(loginBtn){loginBtn.textContent='Enter →';loginBtn.style.opacity='1';} err.textContent = 'Please enter your username.'; return; }
  if (!lang)   { if(loginBtn){loginBtn.textContent='Enter →';loginBtn.style.opacity='1';} err.textContent = 'Please select your language.'; return; }

  const normalised = user.toLowerCase().replace(/@s\.sfusd\.edu$/, '').trim();
  const record = ROSTER[normalised] || ROSTER[normalised + '@s.sfusd.edu'];
  const resolvedUser = normalised;

  if (!record && normalised !== 'other') {
    if(loginBtn){loginBtn.textContent='Enter →';loginBtn.style.opacity='1';}
    err.textContent = 'Username not found. Check your spelling or ask your teacher.';
    return;
  }

  SESSION.username = resolvedUser;
  SESSION.name = name;
  SESSION.period = period;
  SESSION.lang = lang;
  SESSION.isGuest = (normalised === 'other');

  showScreen('home');
  loadStudentHome();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

/* ════════════════════════════════════════════
   HOME SCREEN
════════════════════════════════════════════ */
async function loadStudentHome() {
  document.getElementById('hdr-user-label').textContent =
    `${SESSION.name} · ${SESSION.period}`;
  document.getElementById('home-greeting').textContent =
    `Hi, ${SESSION.name}! 👋`;

  // Load scores from Supabase
  if (!SESSION.isGuest) {
    await loadScores();
  }

  renderAssignmentList();
}

async function loadScores() {
  const rows = await supaGet('ll_practice_scores',
    `username=eq.${SESSION.username}&select=assignment_id,score,total,completed`);
  if (Array.isArray(rows)) {
    rows.forEach(r => {
      ASSIGNMENT_SCORES[r.assignment_id] = {
        score: r.score, total: r.total,
        pct: r.total > 0 ? Math.round(r.score/r.total*100) : 0,
        completed: r.completed
      };
    });
  }
  // Calculate total score
  SESSION.totalScore = Object.values(ASSIGNMENT_SCORES)
    .reduce((sum, s) => sum + (s.score || 0), 0);
  updateScoreBadges();
}

function updateScoreBadges() {
  ['hdr-total-score','q-total-score','sc-total-score'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = SESSION.totalScore;
  });
}

function renderAssignmentList() {
  const list = document.getElementById('assignment-list');
  const active = DEFAULT_ASSIGNMENTS.filter(a => a.active);

  list.innerHTML = active.map(a => {
    const s = ASSIGNMENT_SCORES[a.id];
    const pct = s ? s.pct : 0;
    const done = s && s.completed;
    const label = done ? 'Completed ✓' : (s && s.score > 0 ? 'In progress' : 'Not started');
    const labelClass = done ? 'done' : '';

    return `
    <div class="assignment-card ${done ? 'completed' : ''}" onclick="startAssignment('${a.id}')">
      <div class="asgn-icon ${a.color}">${a.emoji}</div>
      <div class="asgn-body">
        <div class="asgn-title">${a.title}</div>
        <div class="asgn-meta">${a.questionCount} questions · ${a.units.join(', ')} · ${a.aiEnabled ? '🤖 AI feedback' : 'Practice mode'}</div>
        <div class="mini-bar"><div class="mini-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="asgn-right">
        <div class="asgn-pct ${pct === 0 ? 'zero' : ''}">${pct > 0 ? pct+'%' : '—'}</div>
        <div class="asgn-status ${labelClass}">${label}</div>
      </div>
    </div>`;
  }).join('');
}

/* ════════════════════════════════════════════
   QUESTION GENERATION
════════════════════════════════════════════ */
function buildQuestions(assignment) {
  const pool = assignment.units.flatMap(u => VOCAB[u] || []);
  const shuffled = shuffle([...pool]);
  const selected = shuffled.slice(0, Math.min(assignment.questionCount, shuffled.length));

  // Cycle question types: mc, tf, fib, mc, tf, fib...
  const types = ['mc','tf','fib'];
  return selected.map((word, i) => ({
    word,
    type: types[i % types.length],
    pool,  // full pool for distractor generation
    aiEnabled: assignment.aiEnabled
  }));
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getDistractors(word, pool, n) {
  return shuffle(pool.filter(w => w.word !== word.word)).slice(0, n);
}

/* ════════════════════════════════════════════
   ASSIGNMENT START
════════════════════════════════════════════ */
function startAssignment(id) {
  const asgn = DEFAULT_ASSIGNMENTS.find(a => a.id === id);
  if (!asgn) return;
  CURRENT_ASSIGNMENT = asgn;
  QUESTIONS = buildQuestions(asgn);
  Q_IDX = 0;
  Q_RESULTS = [];

  document.getElementById('q-asgn-name').textContent = asgn.title;
  document.getElementById('q-user-label').textContent = `${SESSION.name} · ${SESSION.period}`;

  showScreen('question');
  renderQuestion();
}

/* ════════════════════════════════════════════
   QUESTION RENDERING
════════════════════════════════════════════ */
function renderQuestion() {
  const q = QUESTIONS[Q_IDX];
  const total = QUESTIONS.length;

  // Progress
  const pct = Math.round(Q_IDX / total * 100);
  document.getElementById('q-prog-text').textContent = `${Q_IDX + 1} / ${total}`;
  document.getElementById('q-prog-fill').style.width = pct + '%';

  let html = '';
  if (q.type === 'mc') html = renderMC(q);
  else if (q.type === 'tf') html = renderTF(q);
  else html = renderFIB(q);

  document.getElementById('question-wrap').innerHTML = html;
}

function renderMC(q) {
  const w = q.word;
  const distractors = getDistractors(w, q.pool, 3);
  const opts = shuffle([...distractors.map(d => ({text: d.def, correct: false})),
                        {text: w.def, correct: true}]);
  const optHtml = opts.map((o,i) =>
    `<button class="mc-opt" onclick="checkMC(this,${o.correct})" data-correct="${o.correct}">
      ${o.text}
    </button>`).join('');

  const trans = w.tr && SESSION.lang ? getTranslation(w) : '';

  return `
    <div class="q-card">
      <div class="q-type-label">🎯 Multiple Choice</div>
      <div class="q-prompt">What does <strong>${w.emoji} ${w.word}</strong> mean?
        ${trans ? `<span style="display:block;font-size:.8rem;color:var(--muted);font-weight:600;margin-top:4px;">(${SESSION.lang}: ${trans})</span>` : ''}
      </div>
      <div class="mc-opts">${optHtml}</div>
      <div class="q-feedback" id="q-fb"></div>
      ${q.aiEnabled ? `<div class="ai-panel" id="ai-panel"></div>` : ''}
      ${renderTeacherFeedback(q)}
    </div>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()" disabled>Next →</button>`;
}

function renderTF(q) {
  const w = q.word;
  const isTrue = Math.random() > 0.5;
  let statement, explanation;
  if (isTrue) {
    statement = w.def;
    explanation = '✅ Correct! ' + w.def;
  } else {
    const other = getDistractors(w, q.pool, 1)[0] || q.pool[0];
    statement = `"${w.word}" means: ${other.def}`;
    explanation = `❌ Actually, "${w.word}" means: ${w.def}`;
  }

  const trans = w.tr && SESSION.lang ? getTranslation(w) : '';

  return `
    <div class="q-card">
      <div class="q-type-label">⚖️ True or False?</div>
      <div class="q-prompt"><strong>${w.emoji} ${w.word}</strong>
        ${trans ? `<span style="display:block;font-size:.8rem;color:var(--muted);font-weight:600;">(${SESSION.lang}: ${trans})</span>` : ''}
      </div>
      <div style="background:var(--bg);border-radius:var(--r-sm);padding:14px;margin-bottom:14px;font-size:.95rem;font-weight:600;line-height:1.5;border:1.5px solid var(--border);">
        "${statement}"
      </div>
      <div class="tf-opts">
        <button class="tf-opt" onclick="checkTF(this,${isTrue},true)">👍 True</button>
        <button class="tf-opt" onclick="checkTF(this,${isTrue},false)">👎 False</button>
      </div>
      <div class="q-feedback" id="q-fb"></div>
      <div id="tf-explain" style="font-size:.85rem;color:var(--muted);font-weight:600;margin-top:6px;min-height:14px;"></div>
      ${q.aiEnabled ? `<div class="ai-panel" id="ai-panel"></div>` : ''}
      ${renderTeacherFeedback(q)}
    </div>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()" disabled>Next →</button>`;
}

function renderFIB(q) {
  const w = q.word;
  // Build a sentence with the word blanked
  const def = w.defA || w.def;
  const rx = new RegExp('\\b' + w.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b', 'gi');
  let sentence = def.replace(rx, '___');
  if (!sentence.includes('___')) sentence = def + ' This is called ___.';

  // Word bank: correct + 3 distractors
  const bank = shuffle([w.word, ...getDistractors(w, q.pool, 3).map(d => d.word)]);
  const bankHtml = bank.map(word =>
    `<button class="wb-chip" onclick="fillBlank(this,'${word.replace(/'/g,"\\'")}','${w.word.replace(/'/g,"\\'")}')">${word}</button>`
  ).join('');

  return `
    <div class="q-card">
      <div class="q-type-label">✏️ Fill in the Blank</div>
      <div class="q-prompt">Complete the sentence:</div>
      <div class="fib-sentence">${sentence.replace('___','<input class="fib-blank" id="fib-input" placeholder="?" autocomplete="off" readonly>')}</div>
      <div class="word-bank-row">
        <div style="font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--blue);width:100%;margin-bottom:4px;">Word Bank</div>
        ${bankHtml}
      </div>
      <div class="q-feedback" id="q-fb"></div>
      ${q.aiEnabled ? `<div class="ai-panel" id="ai-panel"></div>` : ''}
      ${renderTeacherFeedback(q)}
    </div>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()" disabled>Next →</button>`;
}

function renderTeacherFeedback(q) {
  // Check if teacher has left feedback for this word in this assignment
  const key = `${SESSION.username}_${CURRENT_ASSIGNMENT?.id}_${q.word.word}`;
  // Will be populated from Supabase asynchronously
  return `<div class="teacher-fb-row" id="tfb-${q.word.word.replace(/\s+/g,'-')}"></div>`;
}

function getTranslation(word) {
  const langMap = {Spanish:'es',Cantonese:'zh',Mandarin:'zh',Arabic:'ar',
                   Vietnamese:'vi',Russian:'ru',Urdu:'ur',Tagalog:'tl',
                   French:'fr',Korean:'ko',Hindi:'hi',Somali:'so',Nepali:'ne',Darija:'ar'};
  const code = langMap[SESSION.lang];
  return word.tr && code ? (word.tr[code] || '') : '';
}

/* ════════════════════════════════════════════
   CHECK ANSWERS
════════════════════════════════════════════ */
function checkMC(btn, isCorrect) {
  const zone = btn.closest('.q-card');
  zone.querySelectorAll('.mc-opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.correct === 'true') b.classList.add('reveal');
  });
  const fb = document.getElementById('q-fb');
  if (isCorrect) {
    btn.classList.add('correct');
    fb.className = 'q-feedback ok'; fb.textContent = '✅ Correct!';
    recordResult(true, btn.textContent.trim());
  } else {
    btn.classList.add('wrong');
    fb.className = 'q-feedback err'; fb.textContent = '❌ Not quite — the correct answer is highlighted.';
    recordResult(false, btn.textContent.trim());
    if (QUESTIONS[Q_IDX].aiEnabled) fetchAIFeedback(false);
  }
  document.getElementById('btn-next').disabled = false;
}

function checkTF(btn, isTrue, userTrue) {
  const zone = btn.closest('.q-card');
  zone.querySelectorAll('.tf-opt').forEach(b => b.disabled = true);
  const correct = isTrue === userTrue;
  const fb = document.getElementById('q-fb');
  const exp = document.getElementById('tf-explain');
  if (correct) {
    btn.classList.add('correct');
    fb.className = 'q-feedback ok'; fb.textContent = '✅ Correct!';
  } else {
    btn.classList.add('wrong');
    fb.className = 'q-feedback err'; fb.textContent = '❌ Not quite.';
    if (exp) exp.textContent = `The statement is ${isTrue ? 'TRUE' : 'FALSE'}.`;
    if (QUESTIONS[Q_IDX].aiEnabled) fetchAIFeedback(false);
  }
  recordResult(correct, userTrue ? 'True' : 'False');
  document.getElementById('btn-next').disabled = false;
}

function fillBlank(btn, chosen, correct) {
  // Fill the input
  const inp = document.getElementById('fib-input');
  if (!inp) return;
  inp.value = chosen;
  btn.classList.add('used');

  const isCorrect = chosen.toLowerCase() === correct.toLowerCase();
  const fb = document.getElementById('q-fb');

  // Disable all chips
  document.querySelectorAll('.wb-chip').forEach(c => c.disabled = true);

  if (isCorrect) {
    inp.classList.add('correct');
    fb.className = 'q-feedback ok'; fb.textContent = '✅ Correct!';
  } else {
    inp.classList.add('wrong');
    fb.className = 'q-feedback err'; fb.textContent = `❌ The answer is "${correct}".`;
    // Show correct chip
    document.querySelectorAll('.wb-chip').forEach(c => {
      if (c.textContent.trim() === correct) { c.style.outline = '2px solid var(--green)'; }
    });
    if (QUESTIONS[Q_IDX].aiEnabled) fetchAIFeedback(false);
  }
  recordResult(isCorrect, chosen);
  document.getElementById('btn-next').disabled = false;
}

function recordResult(correct, userAnswer) {
  const q = QUESTIONS[Q_IDX];
  Q_RESULTS.push({ word: q.word.word, correct, userAnswer, correctAnswer: q.word.def });
}

/* ════════════════════════════════════════════
   AI FEEDBACK
════════════════════════════════════════════ */
async function fetchAIFeedback(correct) {
  const panel = document.getElementById('ai-panel');
  if (!panel) return;
  panel.classList.add('show');
  panel.innerHTML = `<div class="ai-label">🤖 AI Feedback</div><div class="ai-loading">Thinking…</div>`;

  const q = QUESTIONS[Q_IDX];
  const word = q.word.word;
  const def = q.word.def;
  const trans = getTranslation(q.word);
  const langNote = SESSION.lang && trans ? ` In ${SESSION.lang}: "${trans}".` : '';

  const prompt = `A student learning English is practicing the word "${word}". Its definition: "${def}".${langNote} They got it wrong. Give ONE short encouraging sentence of feedback in English, then ONE short sentence in ${SESSION.lang || 'Spanish'} explaining the word. Keep it very simple for a newcomer English learner. Format: English sentence. [Native language sentence].`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 150,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await resp.json();
    const text = data.content?.[0]?.text || '';
    const parts = text.split('.');
    const eng = parts[0]?.trim() + '.';
    const native = parts.slice(1).join('.').trim();
    panel.innerHTML = `
      <div class="ai-label">🤖 Feedback</div>
      <div class="ai-text">${eng}</div>
      ${native ? `<div class="ai-text-native">${native}</div>` : ''}`;
  } catch(e) {
    panel.innerHTML = `<div class="ai-label">🤖 Feedback</div><div class="ai-text">Keep trying — you're learning!</div>`;
  }
}

/* ════════════════════════════════════════════
   NEXT QUESTION / FINISH
════════════════════════════════════════════ */
function nextQuestion() {
  Q_IDX++;
  if (Q_IDX >= QUESTIONS.length) {
    finishAssignment();
  } else {
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

async function finishAssignment() {
  const correct = Q_RESULTS.filter(r => r.correct).length;
  const total = Q_RESULTS.length;
  const pct = Math.round(correct / total * 100);

  // Save to Supabase
  if (!SESSION.isGuest) {
    const prev = ASSIGNMENT_SCORES[CURRENT_ASSIGNMENT.id];
    // Only update if this is better or first time
    const shouldSave = !prev || pct >= (prev.pct || 0);
    if (shouldSave) {
      await supaUpsert('ll_practice_scores', {
        username: SESSION.username,
        student_name: SESSION.name,
        period: SESSION.period,
        assignment_id: CURRENT_ASSIGNMENT.id,
        assignment_title: CURRENT_ASSIGNMENT.title,
        score: correct,
        total,
        pct,
        completed: true,
        lang: SESSION.lang,
        updated_at: new Date().toISOString(),
        results: JSON.stringify(Q_RESULTS.map(r => ({
          word: r.word, correct: r.correct
        })))
      });
    }
    // Update local state
    ASSIGNMENT_SCORES[CURRENT_ASSIGNMENT.id] = { score: correct, total, pct, completed: true };
    SESSION.totalScore = Object.values(ASSIGNMENT_SCORES).reduce((s, x) => s + (x.score||0), 0);
    updateScoreBadges();
  }

  showScreen('score');
  renderScoreScreen(correct, total, pct);
}

function renderScoreScreen(correct, total, pct) {
  document.getElementById('sc-user-label').textContent = `${SESSION.name} · ${SESSION.period}`;

  const emoji = pct >= 80 ? '🎉' : pct >= 60 ? '🙌' : '💪';
  const heroClass = pct >= 80 ? '' : pct >= 60 ? 'partial' : 'low';
  const msg = pct >= 80 ? 'Excellent work!' : pct >= 60 ? 'Good effort!' : 'Keep practicing!';

  const breakdown = Q_RESULTS.map(r => `
    <div class="breakdown-item">
      <div class="bi-icon">${r.correct ? '✅' : '❌'}</div>
      <div class="bi-text">${r.word}</div>
      <div class="bi-result ${r.correct ? 'ok' : 'err'}">${r.correct ? 'Correct' : 'Incorrect'}</div>
    </div>`).join('');

  document.getElementById('score-screen-wrap').innerHTML = `
    <div class="score-hero ${heroClass}">
      <div class="score-emoji">${emoji}</div>
      <div class="score-assignment">${CURRENT_ASSIGNMENT.title}</div>
      <div class="score-main">${correct} / ${total}</div>
      <div class="score-label">${pct}% · ${msg}</div>
    </div>
    <div class="score-breakdown">
      <div class="breakdown-title">Question by Question</div>
      ${breakdown}
    </div>
    <button class="btn-retry" onclick="startAssignment('${CURRENT_ASSIGNMENT.id}')">🔁 Try Again</button>
    <button class="btn-home" onclick="goHome()">← Back to Assignments</button>`;
}

/* ════════════════════════════════════════════
   NAVIGATION
════════════════════════════════════════════ */
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  window.scrollTo({ top: 0 });
}

function goHome() {
  renderAssignmentList();
  showScreen('home');
}

/* ════════════════════════════════════════════
   KEYBOARD SUPPORT
════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('screen-login').classList.contains('active')) {
      attemptLogin();
    }
  }
});
</script>
