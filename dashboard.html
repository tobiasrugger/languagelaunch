<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language Launch · Teacher Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--sky:#1B6CA8;--sky-light:#D6EAFF;--sky-mid:#5FA8D3;--sky-dark:#0D3F66;--green:#2E8B57;--green-light:#D4F5E2;--green-dark:#1A5C38;--red:#C0392B;--red-light:#FDECEA;--amber:#E07B00;--amber-light:#FFF4CC;--purple:#6B3FA0;--purple-light:#EDE0FF;--bg:#F0F4F8;--card:#fff;--text:#1C2B3A;--muted:#5E7A8A;--border:#D0E3F0;--radius:12px;--radius-sm:8px;--shadow:0 2px 10px rgba(27,108,168,0.09);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito Sans',sans-serif;background:var(--bg);color:var(--text);}
header{background:linear-gradient(135deg,var(--sky-dark),var(--sky));padding:20px 28px;box-shadow:0 2px 16px rgba(0,0,0,0.18);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.hdr-title{font-family:'Nunito',sans-serif;font-size:20px;font-weight:800;color:#fff;}
.hdr-title span{color:#A8D8F0;font-weight:600;}
.hdr-actions{display:flex;gap:10px;align-items:center;}
.hdr-btn{padding:7px 16px;border-radius:20px;border:1.5px solid rgba(255,255,255,0.4);background:rgba(255,255,255,0.12);color:#fff;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.15s;}
.hdr-btn:hover{background:rgba(255,255,255,0.25);}
.setup-note{font-size:12px;color:rgba(255,255,255,0.7);font-style:italic;}


.btn{padding:10px 22px;border-radius:30px;border:1.5px solid var(--border);background:var(--card);font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;color:var(--text);transition:all 0.15s;}
.btn:hover{background:var(--sky-light);}
.btn.pri{background:var(--sky);border-color:var(--sky);color:#fff;}
.btn.pri:hover{background:var(--sky-dark);}

/* MAIN LAYOUT */
main{max-width:1100px;margin:0 auto;padding:24px 20px 60px;}
.dash-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
.dash-title{font-family:'Nunito',sans-serif;font-size:22px;font-weight:800;color:var(--sky-dark);}
.last-refresh{font-size:12px;color:var(--muted);}

/* STATS ROW */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:24px;}
.stat-card{background:var(--card);border-radius:var(--radius-sm);padding:14px 16px;box-shadow:var(--shadow);}
.stat-num{font-family:'Nunito',sans-serif;font-size:28px;font-weight:800;color:var(--sky-dark);}
.stat-lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-top:2px;}

/* FILTERS */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;align-items:center;}
.filter-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-right:4px;}
.filter-select{padding:6px 12px;border:1.5px solid var(--border);border-radius:20px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:var(--text);background:var(--card);outline:none;cursor:pointer;}
.filter-select:focus{border-color:var(--sky);}
.search-input{padding:7px 14px;border:1.5px solid var(--border);border-radius:20px;font-size:13px;font-family:'Nunito Sans',sans-serif;color:var(--text);outline:none;min-width:160px;}
.search-input:focus{border-color:var(--sky);}
.clear-btn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);font-size:12px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;color:var(--muted);}
.clear-btn:hover{background:var(--red-light);border-color:var(--red);color:var(--red);}

/* STUDENT SECTIONS */
.student-section{margin-bottom:28px;}
.student-header{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.student-avatar{width:40px;height:40px;border-radius:50%;background:var(--sky-light);display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;color:var(--sky-dark);flex-shrink:0;}
.student-name-lbl{font-family:'Nunito',sans-serif;font-size:17px;font-weight:800;color:var(--text);}
.student-count{font-size:12px;color:var(--muted);font-weight:600;}

/* RECORDING CARDS */
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
.rec-card{background:var(--card);border-radius:var(--radius-sm);padding:14px 16px;box-shadow:var(--shadow);border-left:3px solid var(--border);}
.rec-card.practice{border-left-color:var(--sky);}
.rec-card.assessment{border-left-color:var(--purple);}
.rec-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.rec-word{font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;color:var(--text);}
.rec-type-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:0.4px;}
.badge-practice{background:var(--sky-light);color:var(--sky-dark);}
.badge-assessment{background:var(--purple-light);color:var(--purple);}
.rec-meta{font-size:11px;color:var(--muted);margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;}
.rec-meta span{background:var(--bg);padding:2px 7px;border-radius:8px;}
audio{width:100%;height:30px;margin-top:4px;}
.load-audio-btn{margin-top:6px;padding:5px 14px;border-radius:20px;border:1.5px solid var(--sky-mid);background:var(--sky-light);color:var(--sky-dark);font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer;width:100%;transition:all .15s;}
.load-audio-btn:hover{background:var(--sky);color:#fff;border-color:var(--sky);}
.load-audio-btn:disabled{opacity:.5;cursor:default;}
.match-chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;margin-top:6px;}
.match-chip.match{background:var(--green-light);color:var(--green-dark);}
.match-chip.close{background:var(--amber-light);color:var(--amber);}
.match-chip.no-match{background:var(--red-light);color:var(--red);}
.match-chip.skipped{background:#F1EFE8;color:#888;}
.no-audio{font-size:11px;color:var(--muted);font-style:italic;margin-top:4px;}

/* EMPTY / LOADING */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .big{font-size:48px;margin-bottom:12px;}
.empty-state h3{font-family:'Nunito',sans-serif;font-size:18px;font-weight:700;margin-bottom:6px;color:var(--text);}
.empty-state p{font-size:14px;line-height:1.6;}
.loading{text-align:center;padding:40px;color:var(--muted);font-weight:600;}

/* SETUP OVERLAY - hidden, credentials baked in */
#setup-overlay{display:none;}
/* PASSWORD GATE */
#pw-gate{position:fixed;inset:0;background:linear-gradient(135deg,var(--sky-dark),var(--sky));z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;}
#pw-gate.hidden{display:none;}
.pw-card{background:#fff;border-radius:16px;padding:36px 32px;max-width:380px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.25);}
.pw-card h2{font-family:'Nunito',sans-serif;font-size:22px;font-weight:800;color:var(--sky-dark);margin-bottom:6px;}
.pw-card p{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.6;}
.pw-input{width:100%;padding:13px 16px;border:2px solid var(--border);border-radius:10px;font-size:16px;font-family:'Nunito Sans',sans-serif;color:var(--text);outline:none;text-align:center;letter-spacing:2px;margin-bottom:12px;}
.pw-input:focus{border-color:var(--sky);}
.pw-input.wrong{border-color:var(--red);animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pw-error{font-size:12px;color:var(--red);min-height:16px;margin-bottom:10px;font-weight:600;}
.pw-btn{width:100%;padding:13px;border-radius:30px;border:none;background:var(--sky);color:#fff;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;cursor:pointer;transition:background .2s;}
.pw-btn:hover{background:var(--sky-dark);}
</style>
</head>
<body>

<div id="pw-gate">
  <div class="pw-card">
    <div style="font-size:40px;margin-bottom:12px">🎓</div>
    <h2>Teacher Dashboard</h2>
    <p>Enter the teacher password to view student recordings.</p>
    <input class="pw-input" id="pw-input" type="password" placeholder="Password" autocomplete="off"
      onkeydown="if(event.key==='Enter')checkPW()">
    <div class="pw-error" id="pw-error"></div>
    <button class="pw-btn" onclick="checkPW()">Enter →</button>
  </div>
</div>

<div id="setup-overlay"></div>

<header>
  <div class="hdr-title">Language Launch <span>· Teacher Dashboard</span></div>
  <div class="hdr-actions">
    <span class="setup-note" id="conn-status"></span>
    <button class="hdr-btn" onclick="loadRecordings()">↻ Refresh</button>
  </div>
</header>

<main id="main-content" style="display:none">
  <div class="dash-header">
    <div>
      <div class="dash-title">Student Recordings</div>
      <div class="last-refresh" id="last-refresh"></div>
    </div>
    <button class="btn pri" onclick="loadRecordings()">↻ Refresh</button>
  </div>

  <div class="stats-row" id="stats-row"></div>

  <div class="filters">
    <span class="filter-label">Filter:</span>
    <input class="search-input" id="filter-student" placeholder="Student name…" oninput="renderRecordings()">
    <select class="filter-select" id="filter-type" onchange="renderRecordings()">
      <option value="">All types</option>
      <option value="practice">Practice only</option>
      <option value="assessment">Assessment only</option>
    </select>
    <select class="filter-select" id="filter-unit" onchange="renderRecordings()">
      <option value="">All units</option>
      <option value="U1">Unit 1</option>
      <option value="U2">Unit 2</option>
      <option value="U3">Unit 3</option>
      <option value="U4">Unit 4</option>
    </select>
    <select class="filter-select" id="filter-lesson" onchange="renderRecordings()">
      <option value="">All lessons</option>
      <option value="L1">Lesson 1</option>
      <option value="L2">Lesson 2</option>
      <option value="L3">Lesson 3</option>
      <option value="L4">Lesson 4</option>
      <option value="L5">Lesson 5</option>
      <option value="L6">Lesson 6</option>
      <option value="L7">Lesson 7</option>
      <option value="L8">Lesson 8</option>
      <option value="L9">Lesson 9</option>
      <option value="L11">Lesson 11</option>
    </select>
    <select class="filter-select" id="filter-match" onchange="renderRecordings()">
      <option value="">All results</option>
      <option value="match">Matched</option>
      <option value="close">Close</option>
      <option value="no-match">No match</option>
      <option value="skipped">Skipped</option>
    </select>
    <button class="clear-btn" onclick="clearFilters()">✕ Clear</button>
  </div>

  <div id="recordings-container">
    <div class="loading">Loading recordings…</div>
  </div>
</main>

<script>
// ── CREDENTIALS ──────────────────────────────────────────────────
let SUPA_URL = 'https://lhmwtfyceilgndpygivj.supabase.co';
let SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';

// ── DATA ─────────────────────────────────────────────────────────
let allRecordings=[];

async function loadRecordings(){
  if(!SUPA_URL||!SUPA_KEY) return;
  document.getElementById('recordings-container').innerHTML='<div class="loading">Loading recordings…</div>';
  try{
    const res=await fetch(`${SUPA_URL}/rest/v1/recordings?select=*&order=created_at.desc&limit=500`,{
      headers:{'Authorization':`Bearer ${SUPA_KEY}`,'apikey':SUPA_KEY}
    });
    if(!res.ok) throw new Error('fetch failed');
    allRecordings=await res.json();
    document.getElementById('last-refresh').textContent='Last refreshed: '+new Date().toLocaleTimeString();
    renderStats();
    renderRecordings();
  } catch(e){
    document.getElementById('recordings-container').innerHTML=`<div class="empty-state"><div class="big">⚠️</div><h3>Could not load recordings</h3><p>Check your Supabase credentials in ⚙ Settings.</p></div>`;
  }
}

function renderStats(){
  const total=allRecordings.length;
  const students=new Set(allRecordings.map(r=>r.student_name)).size;
  const practice=allRecordings.filter(r=>r.activity_type==='practice').length;
  const assess=allRecordings.filter(r=>r.activity_type==='assessment').length;
  const matched=allRecordings.filter(r=>r.match_result==='match').length;
  const byUnit={U1:0,U2:0,U3:0,U4:0};
  allRecordings.forEach(r=>{if(r.unit&&byUnit[r.unit]!==undefined)byUnit[r.unit]++;});
  document.getElementById('stats-row').innerHTML=[
    {num:total,lbl:'Total recordings'},
    {num:students,lbl:'Students'},
    {num:practice,lbl:'Practice'},
    {num:assess,lbl:'Assessment'},
    {num:matched,lbl:'Matched'},
    {num:byUnit.U1,lbl:'Unit 1'},
    {num:byUnit.U4,lbl:'Unit 4'},
  ].map(s=>`<div class="stat-card"><div class="stat-num">${s.num}</div><div class="stat-lbl">${s.lbl}</div></div>`).join('');
}

function renderRecordings(){
  const nameQ=(document.getElementById('filter-student').value||'').toLowerCase();
  const typeQ=document.getElementById('filter-type').value;
  const lessonQ=document.getElementById('filter-lesson').value;
  const matchQ=document.getElementById('filter-match').value;

  let filtered=allRecordings.filter(r=>{
    if(nameQ&&!r.student_name.toLowerCase().includes(nameQ)) return false;
    if(typeQ&&r.activity_type!==typeQ) return false;
    const unitQ=document.getElementById('filter-unit')?.value||'';
    if(unitQ&&r.unit!==unitQ) return false;
    if(lessonQ&&r.lesson!==lessonQ) return false;
    if(matchQ&&r.match_result!==matchQ) return false;
    return true;
  });

  if(!filtered.length){
    document.getElementById('recordings-container').innerHTML=`<div class="empty-state"><div class="big">🎤</div><h3>${allRecordings.length?'No results match your filters':'No recordings yet'}</h3><p>${allRecordings.length?'Try clearing some filters.':'Students will appear here once they start practicing or take the assessment.'}</p></div>`;
    return;
  }

  // Group by student
  const byStudent={};
  filtered.forEach(r=>{
    if(!byStudent[r.student_name]) byStudent[r.student_name]=[];
    byStudent[r.student_name].push(r);
  });

  const container=document.getElementById('recordings-container');
  container.innerHTML=Object.entries(byStudent).map(([name,recs])=>{
    const initials=name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const practiceRecs=recs.filter(r=>r.activity_type==='practice');
    const assessRecs=recs.filter(r=>r.activity_type==='assessment');

    // Build cards, practice first then assessment
    const allRecs=[...practiceRecs,...assessRecs];
    const cards=allRecs.map(r=>recCard(r)).join('');

    return `<div class="student-section">
      <div class="student-header">
        <div class="student-avatar">${initials}</div>
        <div>
          <div class="student-name-lbl">${esc(name)}</div>
          <div class="student-count">${practiceRecs.length} practice · ${assessRecs.length} assessment recordings</div>
        </div>
      </div>
      <div class="rec-grid">${cards}</div>
    </div>`;
  }).join('');
}

// Cache of blob URLs so we don't re-fetch the same file
const audioBlobCache = {};

async function loadAudio(url, audioEl, btn) {
  if (!url || url === '(local only)') return;
  btn.textContent = '⏳ Loading…';
  btn.disabled = true;
  try {
    if (audioBlobCache[url]) {
      audioEl.src = audioBlobCache[url];
      audioEl.style.display = 'block';
      btn.style.display = 'none';
      return;
    }
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    // Use the actual MIME type from the response for compatibility
    const typedBlob = new Blob([blob], {type: res.headers.get('content-type') || blob.type || 'audio/webm'});
    const blobUrl = URL.createObjectURL(typedBlob);
    audioBlobCache[url] = blobUrl;
    audioEl.src = blobUrl;
    audioEl.style.display = 'block';
    btn.style.display = 'none';
    // Try to play to catch format errors early
    audioEl.load();
  } catch(e) {
    // Last resort: set src directly from URL
    audioEl.src = url;
    audioEl.style.display = 'block';
    btn.style.display = 'none';
    console.error('Audio load error:', e);
  }
}

function recCard(r){
  const date=new Date(r.created_at);
  const dateStr=date.toLocaleDateString()+' '+date.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  const typeBadge=r.activity_type==='practice'
    ?'<span class="rec-type-badge badge-practice">Practice</span>'
    :'<span class="rec-type-badge badge-assessment">Assessment</span>';
  const matchHtml=r.match_result
    ?`<div class="match-chip ${r.match_result}">${r.match_result==='match'?'✓ Matched':r.match_result==='close'?'~ Close':r.match_result==='skipped'?'Skipped':'No match'}</div>`
    :'';
  const cardId = 'rec-' + Math.random().toString(36).slice(2,8);
  const hasAudio = r.audio_url && r.audio_url !== '(local only)';
  const audioHtml = hasAudio
    ? `<audio id="aud-${cardId}" controls style="width:100%;height:30px;margin-top:4px;display:none"></audio>
       <button class="load-audio-btn" id="btn-${cardId}" onclick="loadAudio('${esc(r.audio_url)}',document.getElementById('aud-${cardId}'),this)">▶ Load &amp; Play</button>`
    : `<div class="no-audio">No audio saved</div>`;
  const lessonTag=r.lesson?`<span>${r.lesson}</span>`:'';
  const unitTag=r.unit?`<span>${r.unit}</span>`:'';
  const levelTag=r.level&&r.level!=='assess'?`<span>Level ${r.level}</span>`:'';
  return `<div class="rec-card ${r.activity_type}" id="${cardId}">
    <div class="rec-card-top">
      <div class="rec-word">${esc(r.word)}</div>
      ${typeBadge}
    </div>
    <div class="rec-meta">${unitTag}${lessonTag}${levelTag}<span>${dateStr}</span></div>
    ${audioHtml}
    ${matchHtml}
  </div>`;
}

function clearFilters(){
  document.getElementById('filter-student').value='';
  document.getElementById('filter-type').value='';
  document.getElementById('filter-lesson').value='';
  document.getElementById('filter-match').value='';
  renderRecordings();
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── PASSWORD GATE ─────────────────────────────────────────────────
function checkPW(){
  const val=document.getElementById('pw-input').value;
  if(val==='galileo2026'){
    document.getElementById('pw-gate').classList.add('hidden');
    sessionStorage.setItem('dash_auth','1');
    document.getElementById('main-content').style.display='block';
    document.getElementById('conn-status').textContent='✓ Connected';
    loadRecordings();
  } else {
    const inp=document.getElementById('pw-input');
    inp.classList.add('wrong');
    document.getElementById('pw-error').textContent='Incorrect password. Try again.';
    inp.value='';
    setTimeout(()=>inp.classList.remove('wrong'),400);
  }
}

// ── BOOT ─────────────────────────────────────────────────────────
if(sessionStorage.getItem('dash_auth')==='1'){
  document.getElementById('pw-gate').classList.add('hidden');
  document.getElementById('main-content').style.display='block';
  document.getElementById('conn-status').textContent='✓ Connected';
  loadRecordings();
} else {
  setTimeout(()=>document.getElementById('pw-input').focus(), 100);
}
</script>
</body>
</html>
